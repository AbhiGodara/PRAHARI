services:
  - type: web
    name: prahari-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://prahari.vercel.app
      - key: PYTHON_VERSION
        value: "3.11"
